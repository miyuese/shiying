<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾影 ShiYing · 设置</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* 页面级布局（组件样式在 ../shared/styles.css） */
  body {
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  .card-section {
    background: var(--bg-2);
    border: 0.5px solid var(--hairline);
    border-radius: var(--r-md);
    padding: 20px;
    margin-bottom: 16px;
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-2);
    margin-bottom: 6px;
  }
  .guide-step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px;
    border-radius: var(--r-sm);
    background: var(--bg-3);
    border: 0.5px solid var(--hairline);
    margin-bottom: 10px;
  }
  .guide-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-grad);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 2px 10px -4px rgba(77, 141, 255, 0.6);
  }
  .result-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 12px;
  }
  .log-box {
    max-height: 220px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.7;
    color: var(--ink-2);
    background: var(--bg-0);
    border: 0.5px solid var(--hairline);
    border-radius: var(--r-sm);
    padding: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead" style="justify-content:flex-start;border-bottom:none;background:transparent;padding:0;margin-bottom:24px;">
    <div class="logo" style="width:36px;height:36px;border-radius:10px;">影</div>
    <div class="brand-stack">
      <h1 class="masthead-title" style="font-size:20px;">拾影 ShiYing 设置</h1>
      <p class="masthead-kicker" style="font-size:9px;">Reverse · Generate · Config</p>
    </div>
  </div>

  <div id="guide" class="card-section"></div>

  <div class="card-section">
    <div class="section-head">
      <span class="section-num">01</span>
      <p class="section-label" style="margin:0;">反推配置（视觉理解）</p>
    </div>
    <div class="field">
      <label>Base URL</label>
      <input class="input" id="reverse-base" placeholder="https://api.openai.com/v1">
    </div>
    <div class="field">
      <label>API Key</label>
      <input class="input" id="reverse-key" type="password" placeholder="sk-...">
    </div>
    <div class="field">
      <label>模型</label>
      <input class="input" id="reverse-model" placeholder="gpt-4o-mini">
    </div>
    <div class="field">
      <label>反推方案</label>
      <select class="select" id="reverse-profile"></select>
    </div>
    <button class="btn btn-secondary" id="test-reverse" style="font-size:12px;"><i data-lucide="scan-line" data-size="13"></i> 测试反推连接</button>
    <div class="result-line" id="result-reverse"></div>
  </div>

  <div class="card-section">
    <div class="section-head">
      <span class="section-num">02</span>
      <p class="section-label" style="margin:0;">生图配置（图像生成）</p>
    </div>
    <div class="field">
      <label>Base URL</label>
      <input class="input" id="generate-base" placeholder="https://api.openai.com/v1">
    </div>
    <div class="field">
      <label>API Key</label>
      <input class="input" id="generate-key" type="password" placeholder="sk-...">
    </div>
    <div class="field">
      <label>模型（可用列表见服务商 /v1/models）</label>
      <input class="input" id="generate-model" list="gen-model-list" placeholder="gpt-image / gpt-image-2">
      <datalist id="gen-model-list">
        <option value="gpt-image"></option>
        <option value="gpt-image-2"></option>
      </datalist>
    </div>
    <button class="btn btn-secondary" id="test-generate" style="font-size:12px;">测试生图连接</button>
    <div class="result-line" id="result-generate"></div>
  </div>

  <div class="card-section">
    <div class="section-head">
      <span class="section-num">03</span>
      <p class="section-label" style="margin:0;">通用</p>
    </div>
    <div class="field">
      <label>默认画幅</label>
      <select class="select" id="aspect-default">
        <option value="1:1">1:1</option>
        <option value="3:4">3:4</option>
        <option value="4:3">4:3</option>
        <option value="9:16">9:16</option>
        <option value="16:9">16:9</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:12px;color:var(--ink-2);">默认人物卡</span>
      <select class="select" id="default-card" style="width:auto;min-width:140px;"></select>
    </div>
    <button class="btn btn-primary btn-block" id="btn-save" style="margin-top:18px;padding:12px;">保存设置</button>
  </div>

  <div class="card-section">
    <div class="section-head">
      <span class="section-num">04</span>
      <p class="section-label" style="margin:0;">最近任务状态（诊断用）</p>
      <button class="btn btn-secondary" id="btn-refresh-tasks" style="margin-left:auto;padding:4px 12px;font-size:11px;">刷新</button>
    </div>
    <div id="task-log" class="log-box">
      <p style="color:var(--ink-3);">点击「刷新」查看任务状态</p>
    </div>
  </div>

  <div class="card-section">
    <div class="section-head">
      <span class="section-num">05</span>
      <p class="section-label" style="margin:0;">错误日志（诊断用）</p>
      <button class="btn btn-secondary" id="btn-refresh-errors" style="margin-left:auto;padding:4px 12px;font-size:11px;">刷新</button>
    </div>
    <div id="error-log" class="log-box">
      <p style="color:var(--ink-3);">点击「刷新」查看错误日志</p>
    </div>
  </div>

  <div class="card-section" style="border-color:rgba(245,194,107,.3);">
    <div class="section-head">
      <span class="section-num">06</span>
      <p class="section-label" style="margin:0;color:var(--amber);">隐私与免责声明</p>
    </div>
    <p style="font-size:11px;color:var(--ink-3);line-height:1.7;margin:0;">
      ① 图片将上传到你配置的 API 服务商进行处理，请勿上传他人私密照片；<br>
      ② 换脸功能仅供学习与创作，请遵守相关法律法规，勿用于虚假信息传播；<br>
      ③ 本扩展不采集任何使用数据，所有素材本地存储。
    </p>
  </div>
</div>
<script type="module" src="./index.ts"></script>
</body>
</html>
